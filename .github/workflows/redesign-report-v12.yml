name: Redesign v11 report
on:
  push:
    paths:
      - '.github/workflows/redesign-report-v12.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign dynamic report
        shell: python
        run: |
          import re, pathlib
          p=pathlib.Path('v11-preview.html')
          s=p.read_text()
          report='''<section id="report" class="page"><div class="r12-wrap">
          <div class="r12-header"><div><h1>التقرير</h1><p>ملخص ائتماني واضح ومبسط من بياناتك</p></div><div class="r12-meta"><span>● آخر تحديث: الآن</span><button class="r12-edit" onclick="openEdit()">تعديل البيانات</button></div></div>
          <section class="r12-borrow"><div class="r12-title"><div><h2>الاقتراض</h2><p>إجمالي ما تدين به</p></div><span class="r12-chip">حسب مدخلاتك الحالية ↗</span></div><div class="r12-debt" id="r12Debt">0 ر.س</div><div class="r12-minirow"><div><span>نسبة الالتزامات من الدخل</span><b id="r12Dti">0%</b></div><div><span>إجمالي القسط الشهري</span><b id="r12Monthly">0 ر.س</b></div><div><span>عدد الالتزامات</span><b id="r12LoansCount">0</b></div></div></section>
          <section class="r12-panel"><div class="r12-panelhead"><div class="r12-icon">▣</div><div><h3>بطاقات الائتمان</h3><p>استخدامك وحدك الائتماني</p></div></div><div class="r12-kpis"><div><span>إجمالي الرصيد المستخدم</span><b id="r12CardUsed">0 ر.س</b></div><div><span>نسبة الاستخدام</span><b id="r12Util">0%</b></div><div><span>إجمالي الحد الائتماني</span><b id="r12CardLimit">0 ر.س</b></div></div><div class="r12-bar"><i id="r12UtilBar"></i></div><div class="r12-status" id="r12UtilStatus">مستوى جيد</div></section>
          <section class="r12-panel"><div class="r12-panelhead"><div class="r12-icon">⌂</div><div><h3>القروض والتمويلات</h3><p>التزاماتك التمويلية الحالية</p></div></div><div class="r12-kpis"><div><span>إجمالي المتبقي</span><b id="r12LoanBal">0 ر.س</b></div><div><span>القسط الشهري</span><b id="r12LoanMonthly">0 ر.س</b></div><div><span>عدد التمويلات</span><b id="r12LoanN">0</b></div></div><div class="r12-bar"><i id="r12LoanBar"></i></div></section>
          <div class="r12-sectionhead"><h2>الحسابات الائتمانية</h2><button onclick="openEdit()">عرض جميع حساباتي ‹</button></div><div class="r12-accounts" id="r12Accounts"></div>
          <div class="r12-sectionhead"><h2>الاستعلامات</h2><button>عرض الكل ‹</button></div><div class="r12-inquiries"><div><span class="r12-badge blue">استعلام شخصي</span><strong>مصرف الراجحي</strong><small>منذ 5 أيام</small></div><div><span class="r12-badge green">طلب تمويل شخصي</span><strong>بنك الرياض</strong><small>منذ 12 يومًا</small></div></div>
          <div class="r12-quick"><div><b>سجل السداد</b><span>✓ جميع المدفوعات منتظمة</span></div><div><b>الاستعلامات الائتمانية</b><span>2 خلال آخر 30 يومًا</span></div></div>
          </div></section>'''
          s,n=re.subn(r'<section id="report" class="page">.*?</section>\s*<section id="finance" class="page">',report+'<section id="finance" class="page">',s,flags=re.S)
          if not n: raise SystemExit('report section not found')
          css='''<style id="report-v12-css">
          #report{background:#f8faf9}.r12-wrap{padding:18px 28px 34px}.r12-header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:28px}.r12-header h1{font-size:34px;margin:0 0 6px}.r12-header p{margin:0;color:#7b8884;font-size:15px}.r12-meta{display:flex;flex-direction:column;align-items:flex-start;gap:12px;color:#7c8985;font-size:12px}.r12-edit{border:0;background:#e9f5f1;color:#17685d;border-radius:14px;padding:11px 15px;font-weight:900}.r12-borrow{margin-bottom:18px}.r12-title{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.r12-title h2,.r12-sectionhead h2{font-size:27px;margin:0}.r12-title p{color:#7d8985;margin:4px 0 0}.r12-chip{background:#ecf6f2;color:#17685d;border-radius:12px;padding:10px 13px;font-weight:900;font-size:12px}.r12-debt{font-size:48px;font-weight:1000;line-height:1.1;margin:12px 0 18px}.r12-minirow{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#e7eeeb;border:1px solid #e1e9e6;border-radius:17px;overflow:hidden}.r12-minirow>div{background:#f6f9f8;padding:14px;text-align:center}.r12-minirow span,.r12-kpis span{display:block;color:#7b8784;font-size:11px}.r12-minirow b{display:block;margin-top:6px;font-size:16px}.r12-panel{background:#fff;border:1px solid #e2e9e6;border-radius:19px;padding:18px;margin-bottom:15px;box-shadow:0 7px 20px rgba(19,63,54,.06)}.r12-panelhead{display:flex;align-items:center;gap:10px;margin-bottom:18px}.r12-panelhead h3{margin:0;font-size:20px}.r12-panelhead p{margin:3px 0 0;color:#85918d;font-size:11px}.r12-icon{width:39px;height:39px;border-radius:12px;background:#e7f5f1;color:#168373;display:grid;place-items:center;font-size:20px}.r12-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.r12-kpis b{display:block;font-size:21px;margin-top:5px}.r12-bar{height:9px;background:#e6ebe9;border-radius:999px;overflow:hidden;margin-top:16px}.r12-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#087f70,#47b4a2);border-radius:999px;transition:width .35s ease}.r12-status{color:#168252;font-size:11px;font-weight:900;margin-top:8px}.r12-sectionhead{display:flex;justify-content:space-between;align-items:center;margin:30px 2px 13px}.r12-sectionhead button{border:0;background:transparent;color:#167668;font-weight:900}.r12-accounts{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 1px 8px}.r12-account{min-width:245px;background:#fff;border:1px solid #e1e8e5;border-radius:18px;padding:15px;scroll-snap-align:start;box-shadow:0 6px 16px rgba(22,67,58,.05)}.r12-acctop{display:flex;align-items:center;gap:11px;padding-bottom:13px;border-bottom:1px solid #edf1ef}.r12-banklogo{width:45px;height:45px;border-radius:13px;display:grid;place-items:center;font-size:15px;font-weight:1000;border:1px solid #e2e9e7;background:#f7faf9}.r12-banklogo.rajhi{color:#1469c8;background:#eef5ff}.r12-banklogo.riyad{color:#a21d25;background:#fff0f1}.r12-banklogo.snb{color:#087a53;background:#ecf9f3}.r12-banklogo.sab{color:#cf1f2b;background:#fff1f2}.r12-acctop strong{display:block;font-size:16px}.r12-acctop small{color:#86918e}.r12-accountkpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:14px}.r12-accountkpis span{display:block;color:#84908c;font-size:10px}.r12-accountkpis b{display:block;font-size:16px;margin-top:4px}.r12-account .r12-bar{margin-top:12px}.r12-inquiries{background:#fff;border:1px solid #e1e8e5;border-radius:18px;overflow:hidden}.r12-inquiries>div{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:15px;border-bottom:1px solid #edf1ef}.r12-inquiries>div:last-child{border:0}.r12-inquiries small{color:#85908d}.r12-badge{border-radius:10px;padding:7px 9px;font-size:10px}.r12-badge.blue{background:#edf4ff;color:#2266ce}.r12-badge.green{background:#edf8f3;color:#167755}.r12-quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.r12-quick>div{background:#fff;border:1px solid #e0e8e5;border-radius:17px;padding:16px}.r12-quick b,.r12-quick span{display:block}.r12-quick span{margin-top:5px;color:#71817b;font-size:11px}@media(max-width:520px){.r12-wrap{padding:18px 16px 28px}.r12-header{display:block}.r12-meta{margin-top:14px;flex-direction:row;justify-content:space-between;align-items:center}.r12-debt{font-size:44px}.r12-minirow,.r12-kpis{grid-template-columns:repeat(3,1fr)}.r12-kpis b{font-size:17px}.r12-title{align-items:center}.r12-chip{font-size:10px}.r12-quick{grid-template-columns:1fr 1fr}}
          </style>'''
          if 'id="report-v12-css"' not in s:s=s.replace('</head>',css+'</head>',1)
          js='''<script id="report-v12-js">(function(){
          const money=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:0}).format(Math.round(+n||0))+' ر.س';
          function bankFor(label,i,type){label=(label||'').toLowerCase();if(label.includes('راجحي'))return['مصرف الراجحي','ر','rajhi'];if(label.includes('رياض'))return['بنك الرياض','ر','riyad'];if(label.includes('أهلي')||label.includes('snb'))return['البنك الأهلي السعودي','SNB','snb'];if(label.includes('ساب')||label.includes('sab'))return['ساب','SAB','sab'];return type==='card'?(i%2?['البنك الأول','A','sab']:['مصرف الراجحي','ر','rajhi']):(i%2?['البنك الأهلي السعودي','SNB','snb']:['بنك الرياض','ر','riyad']);}
          function renderReportV12(){let p={};try{p=JSON.parse(localStorage.getItem('kashf_v11_profile')||'{}')}catch(e){};let fs=p.finances||[],cs=p.cards||[];let income=+p.income||0;let loanBal=fs.reduce((a,x)=>a+(+x.balance||0),0);let monthly=fs.reduce((a,x)=>a+(+x.monthly||((+x.installments||0)?(+x.balance||0)/(+x.installments):0)),0);let cardUsed=cs.reduce((a,x)=>a+(+x.used||0),0),cardLimit=cs.reduce((a,x)=>a+(+x.limit||0),0);let util=cardLimit?Math.round(cardUsed/cardLimit*100):0,dti=income?Math.round(monthly/income*100):0,total=loanBal+cardUsed;let q=id=>document.getElementById(id);if(!q('r12Debt'))return;q('r12Debt').textContent=money(total);q('r12Dti').textContent=dti+'%';q('r12Monthly').textContent=money(monthly);q('r12LoansCount').textContent=fs.length;q('r12CardUsed').textContent=money(cardUsed);q('r12CardLimit').textContent=money(cardLimit);q('r12Util').textContent=util+'%';q('r12UtilBar').style.width=Math.min(util,100)+'%';q('r12UtilStatus').textContent=util<=30?'مستوى ممتاز':util<=50?'مستوى جيد':'استخدام مرتفع يحتاج انتباه';q('r12LoanBal').textContent=money(loanBal);q('r12LoanMonthly').textContent=money(monthly);q('r12LoanN').textContent=fs.length;q('r12LoanBar').style.width=Math.min(dti*2,100)+'%';let items=[];cs.forEach((c,i)=>{let b=bankFor(c.name,i,'card'),u=(+c.limit||0)?Math.round((+c.used||0)/(+c.limit||0)*100):0;items.push(`<div class="r12-account"><div class="r12-acctop"><div class="r12-banklogo ${b[2]}">${b[1]}</div><div><strong>${b[0]}</strong><small>${c.name||'بطاقة ائتمانية'}</small></div></div><div class="r12-accountkpis"><div><span>الرصيد المستخدم</span><b>${money(c.used)}</b></div><div><span>الحد</span><b>${money(c.limit)}</b></div></div><div class="r12-bar"><i style="width:${Math.min(u,100)}%"></i></div></div>`)});fs.forEach((f,i)=>{let b=bankFor(f.bank||f.type,i,'loan');let m=+f.monthly||((+f.installments||0)?(+f.balance||0)/(+f.installments):0);items.push(`<div class="r12-account"><div class="r12-acctop"><div class="r12-banklogo ${b[2]}">${b[1]}</div><div><strong>${b[0]}</strong><small>${f.type||'تمويل شخصي'}</small></div></div><div class="r12-accountkpis"><div><span>المتبقي</span><b>${money(f.balance)}</b></div><div><span>القسط الشهري</span><b>${money(m)}</b></div></div><div class="r12-bar"><i style="width:${Math.min(100,(+f.installments||12)/60*100)}%"></i></div></div>`)});q('r12Accounts').innerHTML=items.length?items.join(''):'<div class="r12-account"><strong>لا توجد حسابات ائتمانية مضافة</strong><small>يمكنك إضافتها من تعديل البيانات</small></div>';}
          window.renderReportV12=renderReportV12;document.addEventListener('DOMContentLoaded',()=>setTimeout(renderReportV12,80));document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-page="report"],button[onclick*="report"]'))setTimeout(renderReportV12,40)});let old=window.renderReport;window.renderReport=function(){try{if(old)old()}catch(e){};renderReportV12()};window.addEventListener('storage',renderReportV12);
          })();</script>'''
          if 'id="report-v12-js"' not in s:s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
      - name: Commit report redesign
        run: |
          git config user.name "Kashf Bot"
          git config user.email "actions@github.com"
          git add v11-preview.html
          git diff --cached --quiet || git commit -m "Redesign report into premium Saudi credit dashboard"
          git push
